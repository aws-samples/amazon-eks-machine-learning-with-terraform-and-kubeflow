apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  backendFramework: {{ .Values.backend_framework }}
  components:
  {{- range $name, $c := .Values.components }}
  - name: {{ $name }}
    type: {{ $c.type }}
    replicas: {{ $c.replicas | default 1 }}
    {{- if $c.shared_memory_size }}
    sharedMemorySize: {{ $c.shared_memory_size | quote }}
    {{- end }}
    {{- if $c.node_count }}
    multinode:
      nodeCount: {{ $c.node_count }}
    {{- end }}
    podTemplate:
      metadata:
        annotations:
          {{- /* While testing, add karpenter.sh/do-not-disrupt: "true" here (or annotate the
                 nodes) to stop Karpenter reclaiming GPU nodes between runs. */}}
          sidecar.istio.io/inject: 'false'
          app.kubernetes.io/instance: {{ $.Release.Name }}
          app.kubernetes.io/managed-by: {{ $.Release.Service }}
          {{- /* Extra annotations, last so a component can override the defaults above. The
                 operator reads some behaviour off pod annotations rather than DGD fields --
                 notably nvidia.com/vllm-distributed-executor-backend, which picks vLLM native
                 multiprocessing or Ray for a multinode component. Left unset, an operator
                 compatibility gate decides, so an example that cares should say which. */}}
          {{- range $k, $v := $c.annotations }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
      spec:
        {{- /* node_types (a list) is preferred over node_type (a single type): pinning to one
               instance type turns any shortage of it into a deployment that never schedules.
               A list of types with comparable VRAM keeps the guard against undersized GPUs
               while letting Karpenter fall back. */}}
        {{- if $c.node_types }}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node.kubernetes.io/instance-type
                      operator: In
                      values:
                      {{- range $t := $c.node_types }}
                        - {{ $t }}
                      {{- end }}
        {{- end }}
        {{- /* node_selector merges with node_type rather than replacing it: node_types says "a
               GPU big enough", node_selector says "from the cudaefa NodePool", and a multinode
               EFA deployment needs both. Pinning the pool is not optional for EFA -- EFA is not
               routed between subnets, and the cuda pool spans every AZ, so two nodes of one LWS
               group can land in different subnets with the fabric silently dead. */}}
        {{- $ns := dict }}
        {{- if and $c.node_type (not $c.node_types) }}
        {{- $ns = set $ns "node.kubernetes.io/instance-type" $c.node_type }}
        {{- end }}
        {{- range $k, $v := $c.node_selector }}
        {{- $ns = set $ns $k $v }}
        {{- end }}
        {{- if $ns }}
        nodeSelector:
          {{- range $k, $v := $ns }}
          {{ $k }}: {{ $v | quote }}
          {{- end }}
        {{- end }}
        {{- /* Tolerate the cuda NodePool taint only for components that ask for a GPU. */}}
        {{- if and $.Values.gpu_tolerations (dig "requests" "nvidia.com/gpu" "" ($c.resources | default dict)) }}
        tolerations:
        {{- range $t := $.Values.gpu_tolerations }}
          - key: {{ $t.key }}
            {{- if $t.operator }}
            operator: "{{ $t.operator }}"
            {{- end }}
            {{- if $t.effect }}
            effect: "{{ $t.effect }}"
            {{- end }}
        {{- end }}
        {{- end }}
        containers:
        {{- /* The operator keys off a container named "main" when it injects the
               discovery and metrics environment into the pod. */}}
        - name: main
          image: {{ $.Values.image }}
          imagePullPolicy: {{ $.Values.image_pull_policy }}
          command: ["python3"]
          args:
          {{- range $a := $c.args }}
            - {{ $a | quote }}
          {{- end }}
          {{- if $c.env }}
          env:
          {{- range $v := $c.env }}
            - name: {{ $v.name }}
              value: "{{ tpl $v.value $ }}"
          {{- end }}
          {{- end }}
          volumeMounts:
          {{- $pv_index := 1 }}
          {{- range $pv := $.Values.pvc }}
            - mountPath: {{ $pv.mount_path }}
              name: pv-{{ $pv_index }}
            {{- $pv_index = add $pv_index 1 }}
          {{- end }}
          resources:
            requests:
            {{- range $k, $v := (($c.resources | default dict).requests | default dict) }}
              {{ $k }}: {{ $v | quote }}
            {{- end }}
            limits:
            {{- range $k, $v := (($c.resources | default dict).limits | default dict) }}
              {{ $k }}: {{ $v | quote }}
            {{- end }}
        volumes:
        {{- $pv_index := 1 }}
        {{- range $pv := $.Values.pvc }}
          - name: pv-{{ $pv_index }}
            persistentVolumeClaim:
              claimName: {{ $pv.name }}
          {{- $pv_index = add $pv_index 1 }}
        {{- end }}
  {{- end }}
