namespace: "karpenter"
role_name:
cluster_id:
consolidate_after: "600s"
capacity_type: "on-demand"
max_pods: 20

# Capacity Reservation Configuration (ODCR and Capacity Blocks for ML, cudaefa only)
cr:
  enabled: false
  cudaefa:
    capacity_types:
      - "on-demand"
    ids: []
    tags: {}

# KAI Scheduler GPU pool (kai_enabled in terraform). Off by default: nothing below renders.
kai:
  enabled: false
  ami_id: ""                # Canonical Ubuntu 24.04 EKS AMI, resolved by terraform from SSM
  cluster_endpoint: ""
  cluster_ca: ""
  cluster_dns_ip: ""
  instance_types:
    - "g6e.xlarge"
  gpu_limit: 1024
  consolidate_after: "1h"   # the GPU Operator builds the driver on each new node (~5 min)
