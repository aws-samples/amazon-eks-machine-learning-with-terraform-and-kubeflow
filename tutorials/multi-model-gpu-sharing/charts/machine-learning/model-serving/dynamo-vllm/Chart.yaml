apiVersion: v2
name: dynamo-vllm
description: >-
  One NVIDIA Dynamo tenant: a DynamoGraphDeployment of one Dynamo frontend and
  one aggregated vLLM worker, the worker attached to the node's MPS control
  daemon under a UUID-keyed pinned-memory envelope. Needs the Dynamo operator
  (the blueprint's dynamo-platform chart) installed in the cluster; the operator
  makes the pods. Everything outside the dynamo_vllm and compat blocks is the
  schema the vllm-openai and vllm-triton-inference-server charts take.
type: application
version: 0.1.0
# The runtime release, read off the image tag and matched to the operator's:
# nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0 under the 1.5.0 operator.
#
# The engine BELOW it is not the siblings'. This image carries vLLM 0.28.0 on
# CUDA 13.0.2, where both NGC 26.07 images carry 0.24.0+092c4842.dev. So a delta
# between this chart and the others is a delta in runtime AND engine build, and
# nothing in a single measurement separates the two. Recorded, not hidden: the
# image is part of the validity key, and there is no Dynamo build on 0.24.0.
appVersion: "1.5.0"
