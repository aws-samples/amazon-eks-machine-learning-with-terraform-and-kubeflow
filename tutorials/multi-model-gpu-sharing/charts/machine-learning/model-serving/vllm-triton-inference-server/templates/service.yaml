apiVersion: v1
kind: Service
metadata:
  name: {{ include "vllm-tis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vllm-tis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
  selector:
    {{- include "vllm-tis.selectorLabels" . | nindent 4 }}
