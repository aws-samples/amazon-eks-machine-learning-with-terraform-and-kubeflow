# vllm-openai values
#
# THIS SCHEMA IS THE SOLVER'S OUTPUT SCHEMA. Nothing here is configurable that
# the solver does not decide. That constraint is what makes fan-out a rendering
# step rather than a translation step (impl §4).
#
# Requirements established by early hardware testing:
#   - the pinned-memory limit MUST be keyed by GPU UUID, never ordinal. An
#     ordinal key references nothing and fails SILENTLY (§10.1, finding 9).
#   - NVIDIA_VISIBLE_DEVICES=all with isolation via CUDA_VISIBLE_DEVICES. This
#     is the reverse of the obvious arrangement and is required (design §1.9).
#   - hostPID / hostIPC / privileged, and the daemon's pipe directory mounted at
#     the same path the daemon uses (finding 6).
#   - no nvidia.com/gpu resource request — the device plugin is bypassed
#     (finding 1).

name: qwen3-0-6b-a          # release-unique tenant name; must be RFC-1123

# In use since 2026-09-02. Nothing measured on the image it replaced is carried
# forward.
# All ten CLI flags below were checked against this image's `--help`.
#
# The engine does NOT run on the node's driver. It runs on the forward-compatibility
# driver bundled in the image, libcuda.so.610.43.02, and says so on every start:
#   NOTE: CUDA Forward Compatibility mode ENABLED.
#     Using CUDA 13.3 driver version 610.43.02 with kernel driver version 580.178.04.
# This matters because under MPS the client and the server must load the same
# libcuda. The MPS server on this node is also on compat 610, so a client that ends
# up on the host's 580 HANGS FOREVER with no error -- see templates/deployment.yaml
# and finding 11. (Plain CUDA 13.3 on the host's 580 libcuda works fine outside MPS:
# measured 44988 MiB free. It is only MPS that requires the match.)
#
# An earlier version of this comment said CUDA 13.3 ran on the node's 580 driver by
# minor-version compatibility. That was wrong. It came from a `kubectl exec` probe,
# and exec'ing through bash silently enables compat -- so the probe measured the
# compat driver and reported it as the host driver.
#
# Both the image and the compat driver it selects are part of the VALIDITY KEY.
#
# Measured on this image, 2026-09-02, 8 GiB envelope, TP=1:
#   Available KV cache      5.13 GiB / 48,032 tokens (max concurrency 11.73x at 4096)
#   CUDA-graph capture      0.18 GiB
#   steady-state resident   7435 MiB of the 8192 MiB envelope
#   extra memory            0.602 GiB -- see mps_reserve_gib below
#   attach-time free        7.59 GiB, i.e. 0.41 GiB below nominal
# TP=2 measured at 8 and 20 GiB. TP=4 and TP=8 have
# NOT been run on this image.
image: nvcr.io/nvidia/vllm:26.07-py3
imagePullPolicy: IfNotPresent

model:
  # NOTE: impl §4 wrote /fsx/models/<model>. The actual on-disk layout is
  # /fsx/pretrained-models/<org>/<model>, which is where the platform's
  # hf-snapshot chart puts weights (SNAPSHOT_ROOT default).
  path: /fsx/pretrained-models/Qwen/Qwen3-0.6B
  served_name: qwen3-0-6b
  revision: ""              # enters the validity key

placement:
  # NO DEFAULTS HERE, and there cannot be any. The GPU-index->UUID mapping is
  # node-specific, so a placement names one physical machine and the individual
  # GPUs in it (impl §7) — nothing about it is portable, not even to another node
  # of the same instance type.
  #
  # These three used to carry the node name and a GPU UUID from the cluster this
  # was developed on. That was a stale example in a defaults file: on an agent run
  # `render_tenant_values` (src/colocation/agent/render.py) overwrites all three
  # from the node it just leased, so the pin was dead weight there — but a hand
  # `helm install` of this chart inherited it and pinned the pod to a node that
  # exists in nobody else's cluster.
  #
  # Left unset so the render fails instead (`vllm-openai.validate` in
  # templates/_helpers.tpl checks all three). For a hand install, read the pairing
  # off the mps-daemon's ConfigMap on the node you mean to use:
  #   kubectl get cm -n <ns> <daemon-release>-gpu-uuids-<node-dns-name> -o yaml
  node:                     # e.g. ip-10-0-1-23.us-west-2.compute.internal
  gpu_indices: []           # host ordinals -> CUDA_VISIBLE_DEVICES, e.g. [0]
  gpu_uuids: []             # from the ConfigMap; ORDER MUST MATCH gpu_indices
                            # e.g. [GPU-00010000-0000-0000-0000-000000000001]

mps:
  pipeHostPath: /var/run/nvidia-mps   # must equal the daemon's pipeHostPath
  pipeMountPath: /mps
  memory_limit_gib: 8                 # -> UUID-keyed limit string (§4.1)
  active_thread_percentage: null       # unset by default; see design §1.4

vllm:
  tensor_parallel_size: 1
  # Computed by the solver, consumed here.
  #
  # CORRECTION to impl §4.2. The spec's formula was
  #   gpu_memory_utilization = (memory_limit_bytes * headroom) / physical_total_bytes
  # and it does not start. Measured on the live node: with limit 8G the engine
  # died with
  #   ValueError: Free memory on device (7.59/44.39 GiB) on startup is less than
  #   desired GPU memory utilization (0.171, 7.59 GiB)
  #
  # Two measured facts collide:
  #   1. vLLM V1 gates startup on `free >= util * total`, and under MPS `free` is
  #      the envelope while `total` is PHYSICAL (finding 4). So the largest
  #      feasible util is observed_free / physical_total — here 7.59 / 44.39 =
  #      0.171, which is exactly what the spec's formula returned. No headroom
  #      survived the round trip; the check failed by a fraction of a GiB.
  #   2. MPS hands back a fixed ~0.41 GiB LESS than the nominal limit as free
  #      (T5: 8G -> 7.59, 16G -> 15.59). At 8 GiB that is 7.59/8 = 0.9488 of
  #      nominal, i.e. already below the 0.95 headroom before headroom is applied.
  #      Applying headroom to the nominal limit therefore over-asks whenever the
  #      envelope is small enough that the constant 0.41 GiB dominates. At 16 GiB
  #      the same offset is only 2.6% and the spec's formula happens to work,
  #      which is why the error is envelope-size dependent and was not caught by
  #      inspection.
  #
  # The offset is CONSTANT, not proportional, so it must be subtracted before the
  # headroom multiply, not folded into it:
  #   gpu_memory_utilization =
  #       ((memory_limit_gib - mps_reserve_gib) * headroom) / physical_total_gib
  # with headroom = 0.95 and physical_total_gib the device's MEASURED memory total
  # -- below nameplate, read from the hardware store (impl §8.1), never typed in.
  #
  # SECOND CORRECTION — what mps_reserve_gib must cover. It is NOT the 0.41 GiB
  # attach-time offset. Set it to 0.41 and the startup gate passes, the weights
  # load, the KV cache is allocated, and then sampler warmup dies of CUDA OOM. Two
  # things that error message makes clear, and both still hold on this image:
  #   - The wall is the NOMINAL envelope, not the smaller number mem_get_info()
  #     reports as free.
  #   - The gap between them grows after attach, as cuBLAS/cuDNN workspaces and
  #     CUDA-graph pools are created. All of it is inside the MPS envelope and all
  #     of it is outside what gpu_memory_utilization accounts for.
  # So the reserve covers EXTRA MEMORY -- everything resident that
  # gpu_memory_utilization does not account for -- and 0.41 is only its floor.
  #
  # Measured on this image, TP=1: extra memory is 0.602 GiB at an 8 GiB envelope
  # and 0.611 GiB at 20 GiB. Flat in the envelope, which is why a constant reserve
  # is the right shape. At TP=2 it is 0.93 GiB per shard, the difference being
  # NCCL's collective buffers -- hence 1.5 for TP>=2.
  #
  # For memory_limit_gib=8 on the card this was measured on: ((8 - 1.0) * 0.95) /
  # device_total = 0.150
  # -> PyTorch budget 6.66 GiB + 0.602 GiB extra = 7.26 GiB against the 8.00 GiB
  #    hard cap. Measured resident 7435 MiB, so 723 MiB of real slack.
  #
  # 1.0 therefore sits about 0.39 GiB above what THIS model needs. Do not tighten
  # it. The reserve only ever applies to a configuration nobody has run yet, so its
  # job is to be safe rather than accurate, and that 0.39 GiB is the margin for
  # models with larger scratch space than Qwen3-0.6B. Once a model has been profiled,
  # its measured extra memory supersedes this default (impl §4.2, §9).
  gpu_memory_utilization: 0.150
  max_num_seqs: 64
  max_num_batched_tokens: 2048
  max_model_len: 4096
  dtype: bfloat16
  extra_args: []

verification:
  enabled: true
  # Observed free sits ~0.41 GiB below the requested envelope (test spec T5:
  # limit 8G -> free 7.59; 16G -> 15.59), so a 0.5 GiB tolerance around the
  # nominal limit is the smallest that passes a correct configuration while
  # still catching a silently-ignored one (which reads back the full 43.94).
  expected_free_gib: null   # null -> defaults to mps.memory_limit_gib
  tolerance_gib: 0.5

service:
  port: 8000

# Shared memory for NCCL / vLLM worker IPC. The container default (64 MiB) is far
# too small for a TP group; NCCL fails to initialize.
shmSizeGi: 16

storage:
  fsxClaimName: pv-fsx
  fsxMountPath: /fsx

readinessProbe:
  # Weight load from FSx-for-Lustre is an HSM pull from S3 on first read and can
  # dominate startup (impl §13). Generous failureThreshold, not a long period,
  # so a healthy engine is detected promptly.
  periodSeconds: 10
  failureThreshold: 180     # 30 min ceiling
  initialDelaySeconds: 30

resources: {}

# Extra environment for the ENGINE container only (not the verification init
# container, which must run under exactly the MPS environment the engine gets and
# nothing else — otherwise it verifies a different envelope; impl §4.4).
#
# Exists for diagnostics that cannot be expressed as vLLM CLI flags. The motivating
# case is NCCL: L40S is PCIe-only with no NVLink, so a TP group must fall back to
# PCIe P2P or host-staged shared memory, and CUDA IPC between two clients of the
# same MPS server is untested (test spec §14 item 2). The failure mode there is a
# HANG at the first collective rather than an error, and without NCCL_DEBUG=INFO a
# hang is undiagnosable.
#
# Empty by default. Anything set here is outside the validity key, so it must not
# become a permanent crutch: an entry that turns out to be load-bearing belongs in
# the chart proper, recorded as a finding.
#   extraEnv:
#   - name: NCCL_DEBUG
#     value: "INFO"
extraEnv: []

nodeSelector: {}

podAnnotations:
  # Mandatory, not cosmetic: the namespace has istio-injection=enabled, and the
  # sidecar adds latency to exactly the measurements the search depends on.
  sidecar.istio.io/inject: "false"
  # Same reasoning, different injector. This cluster runs the CloudWatch Application
  # Signals OpenTelemetry operator, which was found injecting into every tenant pod
  # during early hardware testing. It added four `opentelemetry-auto-instrumentation-*` init
  # containers, four volume mounts, and — the part that matters — set
  # PYTHONPATH=/otel-auto-instrumentation-python/...auto_instrumentation on the ENGINE
  # container. That makes CPython load the OTel agent's sitecustomize at interpreter
  # startup, so the agent runs INSIDE the vLLM engine process: ASGI instrumentation
  # taxes every request and the OTLP exporter runs a background export path. Both land
  # squarely on the latency the harness (§6) exists to measure.
  #
  # It also explains the `AwsEksResourceDetector failed: HTTP Error 403` line in the
  # engine logs, which had been dismissed as benign noise. It was not noise; it was
  # the in-process agent's resource detector, and the only visible symptom that the
  # engine was instrumented at all.
  #
  # Two independent reasons to disable it rather than tolerate it:
  #   1. It is a silent confound. Nothing in the chart or the values file mentioned it,
  #      so a measurement taken here and a measurement taken in a namespace without the
  #      operator are not comparable, and nothing would say why.
  #   2. It is cluster configuration, so it belongs to the validity key (§1) rather than
  #      to the tenant — meaning it can change under us without any chart change.
  # Set unconditionally: an annotation naming an absent injector is inert, so this is
  # safe on clusters without the operator and documents the hazard either way.
  instrumentation.opentelemetry.io/inject-python: "false"
  instrumentation.opentelemetry.io/inject-java: "false"
  instrumentation.opentelemetry.io/inject-nodejs: "false"
  instrumentation.opentelemetry.io/inject-dotnet: "false"

disruption:
  doNotDisrupt: true
