# Traffic that has moved away from the fleet file, one kind of move per tenant, so each shows in
# `drift` on its own: rate up, rate down, a window too thin to read, and requests longer than
# stated. Unlisted tenants run at their fleet demand.
fleet: fleets/examples/g6e.48xlarge/qwen35-multimodal.yaml
hours: 2
tenants:
  docqa: {rate: 0.5}      # the anchor at half its rate: a quiet hour
  caption: {rate: 2.0}    # a rider at twice its rate: the peak the file did not describe
  thumb: {per_hour: 10}   # a trickle: too few requests for a p95
  alt: {osl: 1.5}         # longer answers than the fleet file says, still inside its max_model_len
