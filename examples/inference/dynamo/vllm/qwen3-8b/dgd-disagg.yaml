image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
image_pull_policy: IfNotPresent
backend_framework: vllm

pvc:
  - name: pv-fsx
    mount_path: /fsx
  - name: pv-efs
    mount_path: /efs

gpu_tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

components:
  Frontend:
    type: frontend
    replicas: 1
    args:
      - -m
      - dynamo.frontend
      - --http-port
      - "8000"
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi

  # Prefill-only worker. Computes the prompt's KV cache and hands it to the decode worker over
  # NIXL, so the two phases stop competing for the same SMs.
  #
  # --kv-transfer-config is mandatory, not advisable: dynamo.vllm exits without it. The older
  # --connector flag is rejected in 1.5.0, so Dynamo 0.x examples will not run.
  VllmPrefillWorker:
    type: prefill
    replicas: 1
    # 4-GPU nodes; this worker takes 2 and the decode worker the other 2. A list for the same
    # reason as dgd-agg.yaml.
    node_types:
      - g6e.12xlarge    # 4x L40S 48GB
      - g6.12xlarge     # 4x L4   24GB
      - g5.12xlarge     # 4x A10G 24GB
      - g7.12xlarge     # 4x RTX PRO 6000 96GB
      - g7e.12xlarge    # 4x RTX PRO 6000 96GB
    shared_memory_size: 16Gi
    args:
      - -m
      - dynamo.vllm
      - --model
      - /fsx/pretrained-models/Qwen/Qwen3-8B
      - --served-model-name
      - qwen3-8b
      - --max-model-len
      - "16384"
      - --tensor-parallel-size
      - "2"
      # vLLM's default leaves no headroom at TP=2 on a 24GB card: weights shrink to 7.6GiB per
      # rank, vLLM grows the KV cache to fill the default fraction, and CUDA graph capture plus
      # the NIXL registration buffers then OOM. 0.80 still leaves ~10GiB of KV cache per rank.
      - --gpu-memory-utilization
      - "0.80"
      - --disaggregation-mode
      - prefill
      - --kv-transfer-config
      - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
    resources:
      requests:
        cpu: "8"
        memory: 64Gi
        nvidia.com/gpu: "2"
      limits:
        cpu: "12"
        memory: 96Gi
        nvidia.com/gpu: "2"

  # Decode-only worker. Needs the same connector to receive what prefill sends.
  VllmDecodeWorker:
    type: decode
    replicas: 1
    node_types:
      - g6e.12xlarge
      - g6.12xlarge
      - g5.12xlarge
      - g7.12xlarge
      - g7e.12xlarge
    shared_memory_size: 16Gi
    args:
      - -m
      - dynamo.vllm
      - --model
      - /fsx/pretrained-models/Qwen/Qwen3-8B
      - --served-model-name
      - qwen3-8b
      - --max-model-len
      - "16384"
      - --tensor-parallel-size
      - "2"
      # vLLM's default leaves no headroom at TP=2 on a 24GB card: weights shrink to 7.6GiB per
      # rank, vLLM grows the KV cache to fill the default fraction, and CUDA graph capture plus
      # the NIXL registration buffers then OOM. 0.80 still leaves ~10GiB of KV cache per rank.
      - --gpu-memory-utilization
      - "0.80"
      - --disaggregation-mode
      - decode
      - --kv-transfer-config
      - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
    resources:
      requests:
        cpu: "8"
        memory: 64Gi
        nvidia.com/gpu: "2"
      limits:
        cpu: "12"
        memory: 96Gi
        nvidia.com/gpu: "2"
