# Disaggregated serving, pinned to a single instance type, for benchmarking against
# bench/dgd-agg-2x.yaml. Identical to ../dgd-disagg-tp1.yaml except that node_types is one
# type rather than a list.
#
# The pin is the point: the comparison is only valid if both configurations run on identical
# GPUs. The example file lists many types so it stays schedulable under capacity pressure,
# but that means a run can get an L40S for one worker and an L4 for the other, which would
# measure the GPUs rather than the serving topology.
image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
image_pull_policy: IfNotPresent
backend_framework: vllm

pvc:
  - name: pv-fsx
    mount_path: /fsx
  - name: pv-efs
    mount_path: /efs

gpu_tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

components:
  Frontend:
    type: frontend
    replicas: 1
    args:
      - -m
      - dynamo.frontend
      - --http-port
      - "8000"
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi

  VllmPrefillWorker:
    type: prefill
    replicas: 1
    # ONE instance type, unlike the example files which list many for capacity resilience.
    # The comparison is only valid if every worker runs on an identical GPU: a run that
    # happened to place one worker on an L40S and the other on an L4 would be measuring the
    # GPUs, not the topology. g6.xlarge is an L4 24GB with 4 vCPU and 16GiB of system memory
    # -- the highest-volume single-GPU pool with enough VRAM for Qwen3-8B plus a KV cache.
    #
    # Pinning trades capacity resilience for comparability, and that trade is real: g6e
    # was exhausted in all three of the cluster's AZs while this was being measured, which
    # is why the pin is g6 and not g6e. If the pods stay Pending, repoint the pin -- but
    # repoint it in BOTH bench files, or the numbers stop meaning anything.
    node_types:
      - g6.xlarge
    shared_memory_size: 8Gi
    args:
      - -m
      - dynamo.vllm
      - --model
      - /fsx/pretrained-models/Qwen/Qwen3-8B
      - --served-model-name
      - qwen3-8b
      - --max-model-len
      - "16384"
      - --disaggregation-mode
      - prefill
      - --kv-transfer-config
      - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
    resources:
      requests:
        cpu: "2"
        memory: 11Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "3"
        memory: 14Gi
        nvidia.com/gpu: "1"

  VllmDecodeWorker:
    type: decode
    replicas: 1
    # Same pin as the prefill worker above, for the reason given there.
    node_types:
      - g6.xlarge
    shared_memory_size: 8Gi
    args:
      - -m
      - dynamo.vllm
      - --model
      - /fsx/pretrained-models/Qwen/Qwen3-8B
      - --served-model-name
      - qwen3-8b
      - --max-model-len
      - "16384"
      - --disaggregation-mode
      - decode
      - --kv-transfer-config
      - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
    resources:
      requests:
        cpu: "2"
        memory: 11Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "3"
        memory: 14Gi
        nvidia.com/gpu: "1"
