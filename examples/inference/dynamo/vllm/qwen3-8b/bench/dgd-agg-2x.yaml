# Aggregated serving with two replicas, for benchmarking against dgd-disagg-tp1.yaml.
#
# This exists to make the comparison fair: disaggregation on 2 GPUs against aggregation on 1
# measures the second GPU, not Dynamo. Both files occupy two single-GPU nodes with identical
# requests and node_types, so the only difference is the topology:
#
#   this file             2 aggregated workers, each doing its own prefill and decode
#   dgd-disagg-tp1.yaml   1 prefill worker + 1 decode worker, KV cache sent over NIXL
image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.0
image_pull_policy: IfNotPresent
backend_framework: vllm

pvc:
  - name: pv-fsx
    mount_path: /fsx
  - name: pv-efs
    mount_path: /efs

gpu_tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

components:
  Frontend:
    type: frontend
    replicas: 1
    args:
      - -m
      - dynamo.frontend
      - --http-port
      - "8000"
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 8Gi

  VllmWorker:
    type: worker
    replicas: 2
    # ONE instance type, and the SAME one dgd-disagg-2x.yaml pins to: mixed GPUs across workers
    # would measure the GPUs rather than the topology. g6.xlarge is an L4 24GB, 4 vCPU / 16GiB.
    node_types:
      - g6.xlarge
    shared_memory_size: 8Gi
    args:
      - -m
      - dynamo.vllm
      - --model
      - /fsx/pretrained-models/Qwen/Qwen3-8B
      - --served-model-name
      - qwen3-8b
      - --max-model-len
      - "16384"
    resources:
      requests:
        cpu: "2"
        memory: 11Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "3"
        memory: 14Gi
        nvidia.com/gpu: "1"
