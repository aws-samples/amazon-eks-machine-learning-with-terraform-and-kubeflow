# Capability tiers the demo asks CLM to choose between.
# Tiers are described by capability, never by model name: the description is the
# option text CLM scores the request against, so it must say what the work needs.
tiers:
  small: "Lookup, reformatting, short factual or single-step tasks"
  medium: "Multi-step reasoning, standard coding, structured extraction from long inputs"
  frontier: "Novel problems, deep multi-step reasoning, high-stakes or expert-domain work"
  other: "None of the above / unclear"

# ILLUSTRATIVE ONLY. Not read by triage_demo.py. Shows how a routing layer would map
# tiers to models in code, so a model swap never changes the questions CLM is asked.
example_model_mapping:
  small: us.anthropic.claude-haiku-4-5-20251001-v1:0
  medium: us.anthropic.claude-sonnet-4-6
  frontier: us.anthropic.claude-opus-4-8
